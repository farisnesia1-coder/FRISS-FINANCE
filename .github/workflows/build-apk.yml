
name: Build FRISS FINANCE APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Project
        run: |
          ls -la friss-finance-android
          test -f friss-finance-android/settings.gradle
          test -f friss-finance-android/app/build.gradle

      - name: Build APK
        working-directory: friss-finance-android
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FRISS-FINANCE-APK
          path: friss-finance-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
